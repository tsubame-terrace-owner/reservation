<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- Open Graph (SNSシェア時の表示) -->

  <meta property="og:image" content="https://tsubame-terrace-owner.github.io/reservation/assets/poster.jpg">
  <meta property="og:url" content="https://tsubame-terrace-owner.github.io/reservation/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="燕テラス">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="燕テラス ご予約">
  <meta name="twitter:description" content="奈良県葛城市にある燕テラスのご予約ページ。">
  <meta name="twitter:image" content="https://tsubame-terrace-owner.github.io/reservation/assets/poster.jpg">

  <!-- 構造化データ（飲食店情報をGoogleに伝える） -->

    "@context": "https://schema.org",
    "@type": "Restaurant",

    "address": {
      "@type": "PostalAddress",
      "streetAddress": "中戸411-1 燕さんじょう亭 外蔵",

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GTXCXLNSX5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GTXCXLNSX5');

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: "Noto Serif JP", "Hiragino Mincho ProN", "游明朝", YuMincho, serif;
      background: #FAF8F4;
      color: #2C2824;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ===== ヒーロー ===== */
    .hero {
      position: relative;
      flex: 1;
      /*
        スマホの 100vh はURLバーや下部ツールバーを含んだ高さを指すため、
        実際に見えている領域より縦に長くなり、中央寄せの中身が下寄りに見える。
        svh（実際の表示領域）を使って解消する。1行目は非対応ブラウザ用の保険。
      */
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      overflow: hidden;
    }

    .hero-video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .hero-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.45));
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 24px;
      max-width: 480px;
      width: 100%;
      /*
        真ん中ぴったりだと人の目には沈んで見えるので、下に余白を持たせて
        中身を少し上に押し上げる（見える量はこの値の半分）
      */
      margin-bottom: 9svh;
    }

    .store-name {
      margin: 0;
    }

    /* 背景動画の上に置くので白版のロゴを使う */
    .hero-logo {
      display: block;
      width: 190px;
      max-width: 62%;
      height: auto;
      margin: 0 auto;
      filter: drop-shadow(0 2px 14px rgba(0,0,0,0.45));
    }

    /* CTAはこのラッパー内に縦積み。将来アクセス等を足す時はここに <a> を1行足す */
    .hero-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      margin-top: 56px;
    }

    .hero-btn {
      display: block;
      width: 100%;
      max-width: 280px;
      text-decoration: none;
      padding: 18px 24px;
      font-size: 16px;
      letter-spacing: 0.12em;
      border-radius: 3px;
      font-family: inherit;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      transition: transform 0.15s, background 0.15s;
    }

    .hero-btn:hover, .hero-btn:active {
      transform: translateY(-2px);
    }

    .hero-btn-primary {
      background: rgba(255, 255, 255, 0.96);
      color: #2C2824 !important;
      border: 1px solid rgba(255, 255, 255, 0.96);
    }

    .hero-btn-primary:hover, .hero-btn-primary:active {
      background: white;
    }

    .hero-btn-ghost {
      background: rgba(0, 0, 0, 0.18);
      color: white !important;
      border: 1px solid rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .hero-btn-ghost:hover, .hero-btn-ghost:active {
      background: rgba(0, 0, 0, 0.3);
    }

    /* ===== フッター ===== */
    .footer {
      text-align: center;
      padding: 20px 16px;
      background: #FAF8F4;
      font-size: 12px;
      color: #6B655C;
      letter-spacing: 0.05em;
    }

    /* ===== レスポンシブ ===== */
    @media (max-width: 480px) {
      .hero-logo { width: 165px; }
      .hero-actions { margin-top: 44px; gap: 18px; }
      .hero-btn { padding: 17px 20px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <video class="hero-video"
           autoplay muted loop playsinline
           poster="assets/poster.jpg">
      <source src="assets/hero.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="store-name"><img class="hero-logo" src="assets/logo-white.png" alt="燕テラス" width="190" height="192"></h1>
      <div class="hero-actions">
        <a class="hero-btn hero-btn-ghost" href="./menu.html">ランチメニューはこちら</a>
        <a class="hero-btn hero-btn-primary" href="./form.html">ご予約はこちら</a>
        <!-- 将来アクセスを足す時はここに1行:
             <a class="hero-btn hero-btn-ghost" href="./access.html">アクセスはこちら</a> -->
      </div>
    </div>
  </section>

  <footer class="footer">
    &copy; 燕テラス
  </footer>
</body>
</html>
