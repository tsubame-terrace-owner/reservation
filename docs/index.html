<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>燕テラス ご予約</title>
  <meta name="description" content="燕テラスのご予約フォーム">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Serif JP", "Hiragino Mincho ProN", "游明朝", YuMincho, serif;
      background: #FAF8F4;
      color: #2C2824;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .store-name {
      font-size: 32px;
      font-weight: 500;
      letter-spacing: 0.15em;
      margin-bottom: 12px;
      color: #2C2824;
    }
    .subtitle {
      font-size: 14px;
      color: #6B655C;
      letter-spacing: 0.15em;
      margin-bottom: 48px;
    }
    .reserve-btn {
      display: inline-block;
      background: #7C6F5A;
      color: white;
      text-decoration: none;
      padding: 18px 48px;
      font-size: 16px;
      letter-spacing: 0.1em;
      border-radius: 3px;
      transition: background 0.15s;
      font-family: inherit;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .reserve-btn:hover, .reserve-btn:active {
      background: #5A4F3E;
    }
    .footer {
      margin-top: 64px;
      font-size: 12px;
      color: #6B655C;
      letter-spacing: 0.05em;
    }
    @media (max-width: 480px) {
      .store-name { font-size: 28px; }
      .reserve-btn { padding: 16px 40px; font-size: 15px; width: 100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1 class="store-name">燕テラス</h1>
    <p class="subtitle">ご予約ページ</p>

    <a id="reserve-btn" class="reserve-btn" href="./form.html">
      予約フォームを開く
    </a>

    <div class="footer">&copy; 燕テラス</div>
  </main>
</body>
</html>
