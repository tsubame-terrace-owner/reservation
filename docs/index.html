  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: "Noto Serif JP", "Hiragino Mincho ProN", "游明朝", YuMincho, serif;
      background: #FAF8F4;
      color: #2C2824;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ===== ヒーロー ===== */
    .hero {
      position: relative;
      flex: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      overflow: hidden;
    }

    .hero-video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .hero-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.45));
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 24px;
      max-width: 480px;
      width: 100%;
    }

    .store-name {
      font-size: 36px;
      font-weight: 500;
      letter-spacing: 0.18em;
      margin-bottom: 12px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    .subtitle {
      font-size: 14px;
      letter-spacing: 0.18em;
      margin-bottom: 56px;
      opacity: 0.95;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }

    .reserve-btn {
      display: inline-block;
      background: rgba(255, 255, 255, 0.96);
      color: #2C2824 !important;
      text-decoration: none;
      padding: 20px 56px;
      font-size: 17px;
      letter-spacing: 0.12em;
      border-radius: 3px;
      font-family: inherit;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      transition: transform 0.15s, background 0.15s;
    }

    .reserve-btn:hover, .reserve-btn:active {
      background: white;
      transform: translateY(-2px);
    }

    /* ===== フッター ===== */
    .footer {
      text-align: center;
      padding: 20px 16px;
      background: #FAF8F4;
      font-size: 12px;
      color: #6B655C;
      letter-spacing: 0.05em;
    }

    /* ===== レスポンシブ ===== */
    @media (max-width: 480px) {
      .store-name { font-size: 30px; }
      .subtitle { font-size: 13px; margin-bottom: 44px; }
      .reserve-btn { padding: 18px 44px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <video class="hero-video"
           autoplay muted loop playsinline
           poster="assets/poster.jpg">
      <source src="assets/hero.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="store-name">燕テラス</h1>
      <p class="subtitle">ご予約ページ</p>
      <a class="reserve-btn" href="./form.html">予約フォームを開く</a>
    </div>
  </section>

  <footer class="footer">
    &copy; 燕テラス
  </footer>
</body>
</html>
