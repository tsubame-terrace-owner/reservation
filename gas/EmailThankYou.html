<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  body { color: #2C2824; line-height: 1.8; background: #FAF8F4; margin: 0; padding: 20px; }
  .wrap, .wrap p, .wrap h1, .wrap td, .wrap a, .wrap div { font-family: "Hiragino Mincho ProN", "游明朝", YuMincho, serif; }
  .wrap { max-width: 560px; margin: 0 auto; background: #FFFFFF; border: 1px solid #E8E2D4; }
  .header { text-align: center; padding: 32px 20px 20px; border-bottom: 1px solid #E8E2D4; }
  .store { font-size: 22px; letter-spacing: 0.1em; margin: 0 0 8px; color: #2C2824; }
  .sub { font-size: 13px; color: #7C6F5A; letter-spacing: 0.1em; margin: 0; }
  .body { padding: 28px 28px 20px; }
  .greeting { font-size: 15px; margin: 0 0 20px; }
  .lead { font-size: 14px; margin: 0 0 28px; }
  .btn-sm-area { text-align: center; margin: 24px 0 28px; }
  .btn-sm { display: inline-block; padding: 9px 22px; background: #FFFFFF; color: #7C6F5A !important; text-decoration: none; font-size: 13px; border-radius: 3px; letter-spacing: 0.05em; border: 1px solid #7C6F5A; }
  .closing { font-size: 14px; margin: 28px 0 0; }
  .footer { text-align: center; padding: 20px; font-size: 11px; color: #6B655C; background: #F0EBE0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1 class="store"><?= storeName ?></h1>
    <p class="sub">ご来店ありがとうございました</p>
  </div>

  <div class="body">
    <p class="greeting"><?= reservation.name ?> 様</p>

    <p class="lead">
      本日は<?= storeName ?>にお越しいただき、誠にありがとうございました。<br>
      お料理やお店の居心地はいかがでしたでしょうか。
    </p>

    <p class="lead">
      もしよろしければ、ご感想やメニュー・お店の雰囲気についての率直なご意見を、クチコミにご投稿いただけませんか。これからのお店づくりに活かしてまいります。
    </p>
    <p class="btn-sm-area">
      <a href="<?= googleReviewUrl ?>" class="btn-sm">Googleクチコミを書く</a>
    </p>

    <p class="lead">
      また Instagram（@tsubame_terrace）では新メニューや日々の様子をお知らせしております。フォローされていない方は、よろしければ覗いてみてください。
    </p>
    <p class="btn-sm-area">
      <a href="https://www.instagram.com/tsubame_terrace" class="btn-sm">Instagramをフォローする</a>
    </p>

    <p class="closing">
      またのご来店を心よりお待ちしております。
    </p>
  </div>

  <div class="footer">
    <?= storeName ?>
  </div>
</div>
</body>
</html>
